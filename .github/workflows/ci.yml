# Roda em todo push e pull request - diferente de release.yml, que so
# dispara em tag. Sem isto, nada testava um PR antes do merge: a brecha de
# seguranca corrigida neste mesmo commit so foi pega por revisao manual, nao
# pelo CI, porque o CI simplesmente nao rodava fora de uma tag.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatacao
        run: npm run format:check

      - name: Build (packages primeiro, na ordem de dependencia)
        run: npm run build

      # Inclui os testes de regressao de seguranca em ops/attacks.test.ts -
      # se algum dia uma das cinco falhas da revisao externa reabrir, o
      # build quebra aqui, nao em producao.
      - name: Testes
        run: npm test

      # Bloqueante, mas so sobre o que roda na maquina do usuario (--omit=dev).
      # Uma CVE em ferramenta de build (vite, eslint, zod, undici) nao vai no
      # app empacotado e muitas vezes nao tem correcao por semanas - travar o
      # merge por isso levava a ignorar o CI. O Dependabot cuida das devDeps
      # abrindo PRs de atualizacao; aqui garantimos que nenhuma dependencia de
      # PRODUCAO com falha alta entra.
      - name: Vulnerabilidades conhecidas nas dependencias de producao
        run: npm audit --omit=dev --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
