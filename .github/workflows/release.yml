# Publica uma versao nova do Concord.
#
# Dispara ao empurrar uma tag v* (ex.: git tag v0.2.0 && git push origin v0.2.0).
# O electron-builder cria o release no GitHub e sobe o instalador junto com o
# latest.yml - e esse arquivo que o electron-updater dentro do app procura.
#
# Nao ha segredo para configurar: o GITHUB_TOKEN que o proprio Actions injeta
# basta para publicar no repositorio.
name: release

on:
  push:
    tags:
      - 'v*'
  # Permite gerar um build de teste sem criar release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, nao 20: o script de teste do core passa um glob
      # ("dist/**/*.test.js") direto para `node --test`, e a expansao de glob
      # pelo proprio runner so existe a partir do Node 22. No Node 20 ele nao
      # encontra arquivo nenhum e falha.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      # A saida padrao do electron-builder.yml aponta para uma pasta da maquina
      # de desenvolvimento (fora do OneDrive, que travava o asar). No runner ela
      # nao faz sentido, entao vai para release/ dentro do checkout.
      # stage.js monta apps/desktop/staging, a arvore auto-contida que o
      # electron-builder empacota. Rodar o electron-builder direto pularia essa
      # etapa e empacotaria um staging vazio ou defasado.
      - name: Montar staging
        working-directory: apps/desktop
        run: node scripts/stage.js

      - name: Empacotar e publicar
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        run: >
          npx electron-builder --config electron-builder.yml --win nsis zip
          --config.directories.output=release --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Links que nunca mudam: .../releases/latest/download/Concord-Setup.exe
      # sempre aponta para a versao mais nova. O README e a pasta download/
      # usam esses links, entao ninguem precisa procurar o arquivo certo
      # na lista do release. Os arquivos com versao no nome continuam la:
      # sao eles que o latest.yml do auto-update referencia.
      - name: Links fixos de download e notas do release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop/release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSAO="${TAG#v}"
          cp "Concord-Setup-${VERSAO}.exe" Concord-Setup.exe
          cp "Concord-Portable-${VERSAO}.zip" Concord-Portable.zip
          sha256sum Concord-Setup.exe Concord-Portable.zip \
            "Concord-Setup-${VERSAO}.exe" "Concord-Portable-${VERSAO}.zip" > SHA256SUMS.txt
          gh release upload "$TAG" Concord-Setup.exe Concord-Portable.zip SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"

          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "## Baixar"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| **[Instalador (recomendado)](${BASE}/Concord-Setup.exe)** | Instala, cria atalho e se atualiza sozinho |"
            echo "| [Portatil (.zip)](${BASE}/Concord-Portable.zip) | Descompacte e rode \`Concord.exe\`, sem instalar |"
            echo
            echo "Windows 10/11, 64 bits. Na primeira vez o SmartScreen avisa porque o instalador nao tem assinatura digital: **Mais informacoes > Executar assim mesmo**. Passo a passo em [download/](https://github.com/${GITHUB_REPOSITORY}/tree/master/download)."
            echo
            echo "Quem ja tem o Concord instalado nao precisa baixar nada: o app atualiza sozinho."
            echo
            gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body
          } > notas.md
          gh release edit "$TAG" --notes-file notas.md --repo "$GITHUB_REPOSITORY"

      - name: Empacotar sem publicar
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: apps/desktop
        run: >
          npx electron-builder --config electron-builder.yml --win nsis zip
          --config.directories.output=release --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: concord-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/latest.yml
          if-no-files-found: warn
