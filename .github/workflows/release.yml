# Publica uma versao nova do Concord.
#
# Dispara ao empurrar uma tag v* (ex.: git tag v0.2.0 && git push origin v0.2.0).
# O electron-builder cria o release no GitHub e sobe o instalador junto com o
# latest.yml - e esse arquivo que o electron-updater dentro do app procura.
#
# Nao ha segredo para configurar: o GITHUB_TOKEN que o proprio Actions injeta
# basta para publicar no repositorio.
name: release

on:
  push:
    tags:
      - 'v*'
  # Permite gerar um build de teste sem criar release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, nao 20: o script de teste do core passa um glob
      # ("dist/**/*.test.js") direto para `node --test`, e a expansao de glob
      # pelo proprio runner so existe a partir do Node 22. No Node 20 ele nao
      # encontra arquivo nenhum e falha.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

      # A saida padrao do electron-builder.yml aponta para uma pasta da maquina
      # de desenvolvimento (fora do OneDrive, que travava o asar). No runner ela
      # nao faz sentido, entao vai para release/ dentro do checkout.
      # stage.js monta apps/desktop/staging, a arvore auto-contida que o
      # electron-builder empacota. Rodar o electron-builder direto pularia essa
      # etapa e empacotaria um staging vazio ou defasado.
      - name: Montar staging
        working-directory: apps/desktop
        run: node scripts/stage.js

      - name: Empacotar e publicar
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        run: >
          npx electron-builder --config electron-builder.yml --win nsis zip
          --config.directories.output=release --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Empacotar sem publicar
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: apps/desktop
        run: >
          npx electron-builder --config electron-builder.yml --win nsis zip
          --config.directories.output=release --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: concord-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/latest.yml
          if-no-files-found: warn
