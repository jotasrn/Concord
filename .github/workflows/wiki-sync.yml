name: wiki-sync

on:
  push:
    branches:
      - master
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Sincronizar pasta wiki com a Wiki do GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          WIKI_REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          
          echo "Tentando clonar o repositorio da Wiki do GitHub..."
          if git clone "$WIKI_REPO" wiki_clone; then
            cd wiki_clone
            rm -rf ./*
            cp -r ../wiki/* .
            git add .
            if git status --porcelain | grep -q .; then
              git commit -m "docs(wiki): sincronizar documentacao com wiki do projeto [skip ci]"
              git push origin master || git push origin main
              echo "Wiki sincronizada com sucesso no GitHub!"
            else
              echo "Nenhuma alteracao pendente para atualizar na wiki."
            fi
          else
            echo "::warning:: O repositorio da Wiki do GitHub ainda nao foi inicializado."
            echo "Para inicializar, va em Settings > Features > Wikis (ative se necessario) e crie a primeira pagina na aba Wiki."
          fi
