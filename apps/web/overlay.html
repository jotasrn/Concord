<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:"
    />
    <title>Concord</title>
    <style>
      /* Fundo transparente: so as bolhas sao desenhadas sobre o jogo. */
      html, body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family: Inter, 'Segoe UI', system-ui, sans-serif;
        user-select: none;
        -webkit-app-region: no-drag;
      }
      #lista { display: flex; flex-direction: column; gap: 6px; padding: 8px; align-items: flex-end; }
      .pessoa {
        display: flex; align-items: center; gap: 8px;
        background: rgba(7, 7, 10, 0.82);
        border: 1px solid rgba(139, 92, 246, 0.35);
        border-radius: 999px;
        padding: 4px 12px 4px 4px;
        backdrop-filter: blur(8px);
        transition: border-color .15s, box-shadow .15s;
        max-width: 240px;
      }
      /* Falando: anel verde, o mesmo sinal usado dentro do app. */
      .pessoa.falando {
        border-color: #3BE38B;
        box-shadow: 0 0 14px -2px rgba(59, 227, 139, .55);
      }
      .foto {
        width: 30px; height: 30px; border-radius: 999px;
        object-fit: cover; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 12px; color: #fff;
      }
      .nome {
        font-size: 12px; color: #F2F0F7; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
      }
      .mudo { color: #FF4757; font-size: 12px; flex-shrink: 0; }
    </style>
  </head>
  <body>
    <div id="lista"></div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
